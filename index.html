<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
<title>FriendMarket</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="fm-app.css" />
<style>
  html, body { margin: 0; height: 100%; background: #bfe6ff; }
  #root { height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script>
  // If Supabase redirects to the root domain with a token hash, forward to the app
  if (window.location.pathname === '/' && window.location.hash.includes('access_token')) {
    window.location.replace('/friendmarket' + window.location.hash);
  }
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
  window.FM_SB = window.supabase.createClient(
    'https://ynrunevkcvqhcgmhosjv.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlucnVuZXZrY3ZxaGNnbWhvc2p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1OTE4NTgsImV4cCI6MjA5OTE2Nzg1OH0.IuKQKDAEii1Y5Tij6CUK2oBUjOH5al2KnmVfwfZXW7g'
  );
</script>

<script type="text/babel" src="fm-app-data.jsx?v=10"></script>
<script type="text/babel" src="fm-app-ui.jsx?v=10"></script>
<script type="text/babel" src="fm-app-screens.jsx?v=16"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

function App() {
  const [s, setS] = useState(window.fmLoad);
  const [reachTopic, setReachTopic] = useState(null);
  const [reachMin, setReachMin] = useState(false);
  const [minChats, setMinChats] = useState([]); // minimized chat conv ids
  const [reqTab, setReqTab] = useState('incoming');
  const [composeOpen, setComposeOpen] = useState(false);
  const [composeMin, setComposeMin] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [profileUser, setProfileUser] = useState(null);
  const [profileMin, setProfileMin] = useState(false);
  const [dockOrder, setDockOrder] = useState([]); // keys in the order they were minimized
  const dockAdd = (k) => setDockOrder((d) => d.includes(k) ? d : [...d, k]);
  const dockRemove = (k) => setDockOrder((d) => d.filter((x) => x !== k));
  const menuRef = useRef(null);
  const [recentMine, setRecentMine] = useState([]); // topics you just posted, shown in Browse this session
  const [toasts, setToasts] = useState([]);
  const [resetMode, setResetMode] = useState(false);
  const [confirmDelete, setConfirmDelete] = useState(null); // topic id pending deletion
  const [theme, setTheme] = useState(() => localStorage.getItem('friendmarket:theme') || 'auto');
  const toastTimers = useRef({});

  // resolve theme (auto follows system) -> data-theme on root
  const [systemDark, setSystemDark] = useState(() => window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  useEffect(() => {
    if (!window.matchMedia) return;
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const h = (e) => setSystemDark(e.matches);
    mq.addEventListener ? mq.addEventListener('change', h) : mq.addListener(h);
    return () => { mq.removeEventListener ? mq.removeEventListener('change', h) : mq.removeListener(h); };
  }, []);
  useEffect(() => { localStorage.setItem('friendmarket:theme', theme); }, [theme]);
  const resolvedDark = theme === 'dark' || (theme === 'auto' && systemDark);

  useEffect(() => { window.fmSave(s); }, [s]);

  // open any user's profile from a clicked username
  useEffect(() => {
    window.fmOpenUser = (name) => { setProfileUser(name); setProfileMin(false); setMenuOpen(false); };
    return () => { delete window.fmOpenUser; };
  }, []);

  // close the mobile menu on an outside click
  useEffect(() => {
    if (!menuOpen) return;
    const h = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', h);
    return () => document.removeEventListener('mousedown', h);
  }, [menuOpen]);

  const patch = useCallback((fn) => setS((prev) => fn(prev)), []);

  const addToast = useCallback((ic, text) => {
    const id = window.fmUid();
    setToasts((t) => [...t, { id, ic, text }]);
    toastTimers.current[id] = setTimeout(() => {
      setToasts((t) => t.filter((x) => x.id !== id));
    }, 4200);
  }, []);

  // ---- auth ----
  const onAuth = (acct) => {
    localStorage.removeItem(window.FM_STORE_KEY);
    setS({ account: acct, view: 'browse', topics: [], requests: [], conversations: {}, openChats: [] });
  };
  const onLogout = async () => {
    await window.FM_SB.auth.signOut();
    setToasts([]); setMinChats([]); setReachTopic(null); setReachMin(false);
    setComposeOpen(false); setComposeMin(false); setProfileUser(null); setProfileMin(false); setDockOrder([]);
    setS((p) => ({ ...p, account: null, view: 'browse' }));
  };

  // restore session on load + listen for sign-out
  useEffect(() => {
    window.FM_SB.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        const meta = session.user.user_metadata;
        onAuth({ username: meta.username || session.user.email, email: session.user.email, presence: 'online', status: meta.status || '' });
      }
    });
    const { data: { subscription } } = window.FM_SB.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') { setResetMode(true); }
      if (event === 'SIGNED_OUT') setS((p) => ({ ...p, account: null, view: 'browse' }));
    });
    return () => subscription.unsubscribe();
  }, []);

  // ---- presence / status ----
  const onSetStatus = (status) => patch((p) => ({ ...p, account: { ...p.account, status } }));
  const onSetPresence = (presence) => patch((p) => ({ ...p, account: { ...p.account, presence } }));

  // ---- delete own topic ----
  const onDeleteTopic = (id) => setConfirmDelete(id);
  const doDeleteTopic = () => { patch((p) => ({ ...p, topics: p.topics.filter((t) => t.id !== confirmDelete) })); setConfirmDelete(null); };

  // ---- posting ----
  const onPost = (t) => {
    const id = window.fmUid();
    patch((p) => ({
      ...p,
      topics: [{ id, name: p.account.username, presence: p.account.presence, status: p.account.status, title: t.title, desc: t.desc, format: t.format, category: t.category, replies: 0, ts: Date.now(), mine: true }, ...p.topics],
    }));
    setRecentMine((m) => [id, ...m]);
    patch((p) => ({ ...p, view: 'browse' }));
    addToast('📬', "Your topic is live — it’s at the top of Browse.");
  };

  // ---- reach out ----
  const openChat = (p, convId) => p.openChats.includes(convId) ? p.openChats : [...p.openChats, convId];

  const onSendRequest = ({ message, also }) => {
    const topic = reachTopic;
    setReachTopic(null); setReachMin(false);
    const reqId = window.fmUid();
    patch((p) => ({
      ...p,
      topics: p.topics.map((t) => t.id === topic.id ? { ...t, replies: (t.replies || 0) + 1 } : t),
      requests: [{ id: reqId, dir: 'outgoing', name: topic.name, presence: topic.presence, topicTitle: topic.title, category: topic.category, format: topic.format, message, also, status: 'pending' }, ...p.requests],
    }));
    addToast('↗️', 'Request sent to ' + topic.name + '. Hang tight!');
    // simulate them accepting
    setTimeout(() => {
      const convId = window.fmUid();
      patch((p) => {
        if (!p.requests.some((r) => r.id === reqId)) return p;
        const conv = {
          id: convId, name: topic.name, presence: topic.presence, topicTitle: topic.title, outcome: null,
          messages: [{ from: topic.name, text: 'hey! yes, happy to chat about ' + topic.title.toLowerCase() + ' :)', mine: false }],
        };
        return {
          ...p,
          requests: p.requests.map((r) => r.id === reqId ? { ...r, status: 'accepted', convId } : r),
          conversations: { ...p.conversations, [convId]: conv },
          openChats: openChat(p, convId),
        };
      });
      addToast('🫂', topic.name + ' accepted your request! Say hi.');
    }, 2600);
  };

  // ---- incoming accept / delete ----
  const onAccept = (reqId) => {
    const convId = window.fmUid();
    patch((p) => {
      const req = p.requests.find((r) => r.id === reqId);
      if (!req) return p;
      const conv = {
        id: convId, name: req.name, presence: req.presence, topicTitle: req.topicTitle, outcome: null,
        messages: [{ from: req.name, text: 'yay, thanks for accepting! so excited to talk about ' + req.topicTitle.toLowerCase(), mine: false }],
      };
      return {
        ...p,
        requests: p.requests.filter((r) => r.id !== reqId),
        conversations: { ...p.conversations, [convId]: conv },
        openChats: openChat(p, convId),
      };
    });
    setReqTab('active');
    addToast('🫂', "Chat opened — it's in your Active chats.");
  };
  // deleting removes it for both people (here: gone from the list entirely)
  const onDelete = (reqId) => {
    patch((p) => ({ ...p, requests: p.requests.filter((r) => r.id !== reqId) }));
    addToast('🗑️', 'Request deleted for both of you.');
  };

  // ---- chat windows ----
  const onOpenChat = (convId) => {
    setMinChats((m) => m.filter((c) => c !== convId)); dockRemove('chat:' + convId);
    patch((p) => {
      const c = p.conversations[convId];
      const conversations = c && c.unread ? { ...p.conversations, [convId]: { ...c, unread: 0 } } : p.conversations;
      return { ...p, conversations, openChats: openChat(p, convId) };
    });
  };
  const onCloseChat = (convId) => { setMinChats((m) => m.filter((c) => c !== convId)); dockRemove('chat:' + convId); patch((p) => ({ ...p, openChats: p.openChats.filter((c) => c !== convId) })); };
  const onMinChat = (convId) => { setMinChats((m) => m.includes(convId) ? m : [...m, convId]); dockAdd('chat:' + convId); };
  const onRestoreChat = (convId) => { setMinChats((m) => m.filter((c) => c !== convId)); dockRemove('chat:' + convId); };

  const onSendMessage = (convId, text) => {
    patch((p) => {
      const c = p.conversations[convId];
      if (!c) return p;
      return { ...p, conversations: { ...p.conversations, [convId]: { ...c, messages: [...c.messages, { from: 'me', text, mine: true }] } } };
    });
    setTimeout(() => {
      patch((p) => {
        const c = p.conversations[convId];
        if (!c || c.outcome) return p;
        const reply = window.FM_REPLIES[Math.floor(Math.random() * window.FM_REPLIES.length)];
        return { ...p, conversations: { ...p.conversations, [convId]: { ...c, messages: [...c.messages, { from: c.name, text: reply, mine: false }] } } };
      });
    }, 1200);
  };

  const onMark = (convId, outcome) => {
    patch((p) => {
      const c = p.conversations[convId];
      if (!c) return p;
      return { ...p, conversations: { ...p.conversations, [convId]: { ...c, outcome, messages: [...c.messages, { from: 'sys', text: outcome === 'success' ? 'You marked this a successful connection.' : "You marked this: didn’t work out." }] } } };
    });
    addToast(outcome === 'success' ? '✔️' : '👋', outcome === 'success' ? 'Nice — marked as a successful connection!' : 'Marked. Onward to the next one!');
  };

  // navigate between views; clears your just-posted topics from Browse
  const goView = (v) => { setRecentMine([]); setMenuOpen(false); patch((p) => ({ ...p, view: v })); };

  const reset = () => {
    if (!confirm('Reset the prototype to its starting state? Your demo account and chats will be cleared.')) return;
    Object.values(toastTimers.current).forEach(clearTimeout);
    setToasts([]); setMinChats([]); setReachTopic(null); setReachMin(false); setComposeOpen(false); setComposeMin(false); setProfileUser(null); setProfileMin(false); setDockOrder([]);
    setS(window.fmSeed());
  };

  // ---- render ----

  if (resetMode) {
    return (
      <div className="fmw fm-desktop" data-theme={resolvedDark ? 'dark' : 'light'}>
        <ThemeToggle theme={theme} onChange={setTheme} />
        <ResetPasswordScreen onDone={() => { setResetMode(false); }} />
      </div>
    );
  }

  if (!s.account) {
    return (
      <div className="fmw fm-desktop" data-theme={resolvedDark ? 'dark' : 'light'}>
        <ThemeToggle theme={theme} onChange={setTheme} />
        <AuthScreen onAuth={onAuth} />
      </div>
    );
  }

  const pendingIncoming = s.requests.filter((r) => r.dir === 'incoming' && r.status === 'pending').length;
  const requestedTitles = new Set(s.requests.filter((r) => r.dir === 'outgoing').map((r) => r.topicTitle));
  const openChatIds = s.openChats.filter((id) => s.conversations[id]);

  return (
    <div className="fmw fm-desktop" data-theme={resolvedDark ? 'dark' : 'light'}>

      <div className="fm-app-win fm-win">
        <div className="fm-titlebar">
          <span className="fm-tb-title"><Hug size={15} /> FriendMarket</span>
          <WinButtons variant="main" />
        </div>
        <div className="fm-header">
          <div className="fm-brand">
            <span className="fm-logomark"><Hug size={24} /></span>
            <span className="fm-logo">Friend<b>Market</b></span>
            <span className="fm-tagline">find someone to talk to</span>
          </div>
          <nav className="fm-nav">
            <button className={s.view === 'browse' ? 'is-active' : ''} onClick={() => goView('browse')}>Browse</button>
            <button className={s.view === 'requests' ? 'is-active' : ''} onClick={() => goView('requests')}>
              Chats {pendingIncoming > 0 && <span className="fm-count">{pendingIncoming}</span>}
            </button>
            <button className={s.view === 'profile' ? 'is-active' : ''} onClick={() => goView('profile')}>My Account</button>
            <button className="fm-btn fm-btn--primary fm-nav-post" onClick={() => setComposeOpen(true)}>Post topic</button>
          </nav>
          <div className="fm-menu" ref={menuRef}>
            <button className="fm-menu-btn" onClick={() => setMenuOpen((o) => !o)} aria-label="Menu" aria-expanded={menuOpen}>
              <span className="fm-menu-ic">{'☰'}</span>
              {pendingIncoming > 0 && <span className="fm-count fm-menu-count">{pendingIncoming}</span>}
            </button>
            {menuOpen && (
              <div className="fm-menu-dd">
                <button className={s.view === 'browse' ? 'is-active' : ''} onClick={() => goView('browse')}>Browse</button>
                <button className={s.view === 'requests' ? 'is-active' : ''} onClick={() => goView('requests')}>
                  Chats {pendingIncoming > 0 && <span className="fm-count">{pendingIncoming}</span>}
                </button>
                <button className={s.view === 'profile' ? 'is-active' : ''} onClick={() => goView('profile')}>My Account</button>
                <div className="fm-menu-sep"></div>
                <button className="fm-menu-post" onClick={() => { setComposeOpen(true); setMenuOpen(false); }}>{'+'} Post a new topic</button>
              </div>
            )}
          </div>
        </div>
        <MeBar account={s.account} onSetStatus={onSetStatus} onSetPresence={onSetPresence} />

        {s.view === 'browse' && <BrowseScreen topics={s.topics} recentMine={recentMine} onReach={(t) => { setReachTopic(t); setReachMin(false); }} onDelete={onDeleteTopic} requestedTitles={requestedTitles} />}
        {s.view === 'requests' && <ChatsScreen requests={s.requests} conversations={s.conversations} tab={reqTab} setTab={setReqTab} onAccept={onAccept} onDelete={onDelete} onOpenChat={(id) => { onOpenChat(id); }} />}
        {s.view === 'profile' && <ProfileScreen account={s.account} topics={s.topics} conversations={s.conversations} onReach={(t) => { setReachTopic(t); setReachMin(false); }} onDelete={onDeleteTopic} theme={theme} onSetTheme={setTheme} onLogout={onLogout} />}
      </div>

      {/* post a new topic modal */}
      {composeOpen && <ComposeModal onPost={onPost} hidden={composeMin}
        onMinimize={() => { setComposeMin(true); dockAdd('compose'); }} onClose={() => { setComposeOpen(false); setComposeMin(false); dockRemove('compose'); }} />}

      {/* a user's profile (opened by tapping their name) */}
      {profileUser && <UserProfileModal name={profileUser} topics={s.topics} requests={s.requests}
        conversations={s.conversations} account={s.account} requestedTitles={requestedTitles} hidden={profileMin}
        onMinimize={() => { setProfileMin(true); dockAdd('profile'); }}
        onReach={(t) => { setReachTopic(t); setReachMin(false); }} onClose={() => { setProfileUser(null); setProfileMin(false); dockRemove('profile'); }} />}

      {/* chat windows (minimized ones stay mounted but hidden) */}
      {openChatIds.map((id, i) => (
        <ChatWindow key={id} conv={s.conversations[id]} myName={s.account.username} index={i}
          minimized={minChats.includes(id)}
          onMinimize={onMinChat} onClose={onCloseChat} onSend={onSendMessage} onMark={onMark} />
      ))}

      {/* reach-out modal (stays mounted while minimized to keep your draft) */}
      {reachTopic && <ReachOutModal topic={reachTopic} hidden={reachMin}
        onMinimize={() => { setReachMin(true); dockAdd('reach'); }} onClose={() => { setReachTopic(null); setReachMin(false); dockRemove('reach'); }} onSend={onSendRequest} />}

      {/* dock for minimized popups (bottom-right) - oldest at the bottom */}
      {dockOrder.length > 0 && (
        <div className="fm-dock">
          {dockOrder.map((key) => {
            if (key === 'compose' && composeOpen && composeMin) return (
              <div key="compose" className="fm-dock-chip" onClick={() => { setComposeMin(false); dockRemove('compose'); }}>
                <Hug size={14} /><span className="ellip">Post a new topic</span>
                <button className="x" onClick={(e) => { e.stopPropagation(); setComposeOpen(false); setComposeMin(false); dockRemove('compose'); }}>{'×'}</button>
              </div>
            );
            if (key === 'profile' && profileUser && profileMin) return (
              <div key="profile" className="fm-dock-chip" onClick={() => { setProfileMin(false); dockRemove('profile'); }}>
                <Hug size={14} /><span className="ellip">{profileUser}{'’'}s profile</span>
                <button className="x" onClick={(e) => { e.stopPropagation(); setProfileUser(null); setProfileMin(false); dockRemove('profile'); }}>{'×'}</button>
              </div>
            );
            if (key === 'reach' && reachTopic && reachMin) return (
              <div key="reach" className="fm-dock-chip" onClick={() => { setReachMin(false); dockRemove('reach'); }}>
                <Hug size={14} /><span className="ellip">Reach out: {reachTopic.name}</span>
                <button className="x" onClick={(e) => { e.stopPropagation(); setReachTopic(null); setReachMin(false); dockRemove('reach'); }}>{'×'}</button>
              </div>
            );
            if (key.startsWith('chat:')) {
              const id = key.slice(5);
              if (!minChats.includes(id) || !openChatIds.includes(id)) return null;
              return (
                <div key={key} className="fm-dock-chip" onClick={() => onRestoreChat(id)}>
                  <span className={'fm-dot fm-dot--' + s.conversations[id].presence}></span>
                  <span className="ellip">{s.conversations[id].name}</span>
                  <button className="x" onClick={(e) => { e.stopPropagation(); onCloseChat(id); }}>{'×'}</button>
                </div>
              );
            }
            return null;
          })}
        </div>
      )}

      {confirmDelete && (
        <ConfirmModal message="Delete this topic? This can't be undone."
          confirmLabel="Delete topic" onConfirm={doDeleteTopic} onCancel={() => setConfirmDelete(null)} />
      )}

      {/* toasts */}
      <div className="fm-toasts">
        {toasts.map((t) => (
          <div key={t.id} className="fm-toast"><span className="ic">{t.ic}</span><span>{t.text}</span></div>
        ))}
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
